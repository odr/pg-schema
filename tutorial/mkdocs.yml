site_name: pg-schema tutorial
site_description: Practical guide to pg-schema (RU first, EN later)
site_url: https://odr.github.io/pg-schema/
repo_url: https://github.com/odr/pg-schema
theme:
  name: material
  # name: readthedocs
  language: ru
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.snippets:
      # пути считаются от каталога tutorial/ (mkdocs запускается оттуда):
      #   docs/...           — вспомогательные md-фрагменты
      #   app/..., sql/...   — исходники примеров (секции -- --8<-- [start:name])
      #   out/tutorial.txt   — вывод примеров (make tut-run)
      base_path:
        - docs
        - .
      check_paths: true
      dedent_subsections: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      # emoji_index: !!python/name:material.extensions.emoji.twemoji
      # emoji_generator: !!python/name:material.extensions.emoji.to_svg

docs_dir: docs

# перестраивать сайт в mkdocs serve при изменении примеров и их вывода
watch:
  - app/app
  - app/generator
  - sql
  - out

nav:
  - Русский:
      - Введение: ru/index.md
      - Быстрый старт: ru/01-wow.md
      - Рабочая модель pg-schema: ru/02-core-workflow.md
      - Изменение данных в одной таблице: ru/03-flat-dml.md
      - Select: ru/04-select.md
      - Изменение связанных данных: ru/05-tree-dml.md
      - Ошибки компиляции: ru/06-compiler-errors.md
      - На практике: ru/07-practice.md
      - Справочник: ru/appendix-reference.md
      - Типы данных: ru/appendix-types.md
  - English:
      - Introduction: en/index.md

extra_css:
  - styles/emoji.css
