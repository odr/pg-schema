site_name: pg-schema tutorial
site_description: Practical guide to pg-schema
site_url: https://odr.github.io/pg-schema/
repo_url: https://github.com/odr/pg-schema
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.snippets:
      # paths are relative to tutorial/ (mkdocs runs there):
      #   snippets/...       — copies of library / Sch.hs fragments
      #   app/..., sql/...   — sources of the examples (-- --8<-- [start:name] sections)
      #   out/tutorial.txt   — output of the examples (make tut-run)
      base_path:
        - docs
        - .
      check_paths: true
      dedent_subsections: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      # emoji_index: !!python/name:material.extensions.emoji.twemoji
      # emoji_generator: !!python/name:material.extensions.emoji.to_svg

docs_dir: docs

# rebuild the site in mkdocs serve when the examples or their output change
watch:
  - app/app
  - app/generator
  - sql
  - out
  - snippets

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
          site_description: Практическое руководство по pg-schema
          nav_translations:
            Introduction: Введение
            Quick start: Быстрый старт
            Core workflow: Рабочая модель pg-schema
            Single-table DML: Изменение данных в одной таблице
            Select: Select
            Tree DML: Изменение связанных данных
            Compiler errors: Ошибки компиляции
            In practice: На практике
            Reference: Справочник
            Data types: Типы данных

nav:
  - Introduction: index.md
  - Quick start: 01-wow.md
  - Core workflow: 02-core-workflow.md
  - Single-table DML: 03-flat-dml.md
  - Select: 04-select.md
  - Tree DML: 05-tree-dml.md
  - Compiler errors: 06-compiler-errors.md
  - In practice: 07-practice.md
  - Reference: appendix-reference.md
  - Data types: appendix-types.md

extra_css:
  - styles/emoji.css
