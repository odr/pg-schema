name: Tutorial site

# Builds the tutorial (tutorial/, MkDocs) and publishes it to GitHub Pages.
# The examples' output (tutorial/out/tutorial.txt) is committed, so no
# database or GHC is needed here.

on:
  push:
    branches: [master]
    paths:
      - 'tutorial/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [master]
    paths:
      - 'tutorial/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: '1'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install MkDocs
        run: pip install mkdocs==1.6.1 mkdocs-material==9.8.1 pymdown-extensions==13.0

      - name: Build site
        working-directory: tutorial
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: tutorial/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
